[package]
name = "deck"
version = "2.8.2"
description = "Dashboard, launcher and Windows power tools in one tray app"
authors = ["moudi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
jwalk = "0.9.0"
parking_lot = "0.12.5"
png = "0.18.1"
qrcode = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Transfer (AppBeam) and Claude Sync: encrypted LAN channel, hashing, compression
blake3 = "1"
# the phone remote's request signatures (HMAC-SHA256; already built for Tauri)
sha2 = "0.10"
# PC to PC: each PC's own Ed25519 key (already built for HTTPS)
ring = "0.17"
chacha20poly1305 = "0.10"
memchr = "2"
socket2 = "0.6"
flate2 = "1"
aho-corasick = "1"
sysinfo = "0.39.6"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tungstenite = "0.30.0"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Shutdown",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_RestartManager", "Win32_System_Registry",
  "Win32_System_SystemInformation", "Win32_Devices_Display", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController",
  "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_HiDpi", "Win32_Devices_FunctionDiscovery", "Win32_System_Console",
  "Win32_UI_Accessibility", "Win32_System_Time", "Win32_System_RemoteDesktop", "Win32_Storage_Packaging_Appx",
  "Win32_Media_MediaFoundation", "Gaming_Input", "Devices_Power", "System_Power",
  "Foundation", "Foundation_Collections", "Media_Control", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization",
  "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
] }
windows-core = "0.62"
# MoboCtl's hardware engine (src/hw) is written against windows-sys
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading",
  "Win32_System_Services", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Time", "Win32_Security_Authorization", "Win32_System_LibraryLoader", "Win32_System_SystemInformation",
  "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Ioctl", "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_System_Performance",
  "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Devices_Properties", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Pipes",
  "Wdk_Foundation", "Wdk_Storage_FileSystem",
] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
# the phone's Screen view: fast JPEG (AVX2 when the CPU has it), straight from Windows' BGRA pixels
jpeg-encoder = { version = "0.7", features = ["simd"] }
windows-future = "0.3"
# the controller overlay's art: SVG drawn in code, rasterised once per look (text only: no system font scan)
resvg = { version = "0.48", default-features = false, features = ["text"] }
# the phone remote's HTTPS (the phone mic needs a secure page): rustls on ring (already built for
# ureq) and a self-signed certificate made on the PC
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Tweaks → Get Store apps: Microsoft's update service answers in XML; its files are checked by
# SHA-1/SHA-256; the usual web roots (already built for ureq) plus Microsoft's two
roxmltree = "0.21"
sha1 = "0.10"
webpki-roots = "1"
vigem-client = { version = "0.1.4", default-features = false }

# `cargo test` / `cargo clippy` use the dev profile: incremental, with the dependencies
# optimised once (a test run then rebuilds only Deck itself, in seconds)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
