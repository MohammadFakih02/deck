# Exploit mitigations for Deck's own code (it runs with admin rights): Control Flow Guard checks
# every indirect call; /CETCOMPAT lets Windows keep hardware shadow stacks of return addresses.
# The 32-bit RivaTuner helper gets its flags from build.rs.
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ccontrol-flow-guard", "-Clink-arg=/CETCOMPAT"]
